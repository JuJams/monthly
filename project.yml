# XcodeGen spec. On your Mac, run `xcodegen` in this folder to create Monthly.xcodeproj.
# Change BUNDLE_PREFIX below to something unique to you (e.g. com.yourname) — that's the only edit needed.
name: Monthly
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_PREFIX: com.example
    APP_GROUP_ID: group.$(BUNDLE_PREFIX).monthly
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Monthly:
    type: application
    platform: iOS
    sources:
      - Monthly
      - Shared
    info:
      path: Monthly/Info.plist
      properties:
        CFBundleDisplayName: Monthly
        UILaunchScreen: {}
        AppGroupID: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [monthly]
    entitlements:
      path: Monthly/Monthly.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).monthly
    dependencies:
      - target: MonthlyWidget
  MonthlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - MonthlyWidget
      - Shared
    info:
      path: MonthlyWidget/Info.plist
      properties:
        CFBundleDisplayName: Monthly
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MonthlyWidget/MonthlyWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).monthly.widget
